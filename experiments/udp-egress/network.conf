[program:udp-egress]
command=python3 -u /opt/udp-egress/network.py
priority=1
autostart=true
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisord/udp-egress
redirect_stderr=true

[program:udp-relay]
command=python3 -u /opt/udp-egress/udp.py
priority=2
autostart=true
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisord/udp-relay
redirect_stderr=true
