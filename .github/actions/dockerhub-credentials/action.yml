name: Docker Hub credentials from SSM
description: Read the shared registry credential without replacing the caller's AWS credentials.
inputs:
  role-arn:
    description: Optional role to assume for the read; omit to use existing AWS credentials.
    required: false
    default: ''
  role-chaining:
    description: Assume the role using existing AWS credentials rather than GitHub OIDC.
    required: false
    default: 'false'
outputs:
  username:
    value: ${{ steps.read.outputs.username }}
  password:
    value: ${{ steps.read.outputs.password }}
  credentials:
    description: JSON username/password pair for Ansible.
    value: ${{ steps.read.outputs.credentials }}
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      if: inputs.role-arn != ''
      id: aws
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-chaining: ${{ inputs.role-chaining }}
        aws-region: us-east-1
        allowed-account-ids: '613957054632'
        output-credentials: true
        output-env-credentials: false
    - id: read
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id || env.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key || env.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token || env.AWS_SESSION_TOKEN }}
      run: |
        python3 - <<'PY'
        import json, os, subprocess
        raw = subprocess.check_output([
            "aws", "ssm", "get-parameter", "--name", "/kernel/dockerhub/credentials",
            "--region", "us-east-1", "--with-decryption", "--output", "json",
        ], text=True)
        parameter = json.loads(raw)["Parameter"]
        if parameter["Type"] != "SecureString":
            raise ValueError("Docker Hub credentials must be stored as a SecureString")
        credential = json.loads(parameter["Value"])
        for key in ("username", "password"):
            value = credential.get(key)
            if not isinstance(value, str) or not value or "\n" in value or "\r" in value:
                raise ValueError("SSM must contain a nonempty, single-line username and password")
        values = {key: credential[key] for key in ("username", "password")}
        values["credentials"] = json.dumps(values)
        for value in values.values():
            print("::add-mask::" + value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            for key, value in values.items():
                output.write(f"{key}={value}\n")
        PY
