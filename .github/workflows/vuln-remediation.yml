name: Vulnerability Remediation

on:
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vuln-remediation*'
      - 'socket.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    uses: kernel/infra/.github/workflows/vuln-remediation.yml@security/vuln-remediation-reusable
    with:
      go-version-file: 'server/go.mod'
    secrets: inherit
