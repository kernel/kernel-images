name: Vulnerability Remediation

on:
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # vuln-remediation exchanges the job's OIDC token for short-lived model credentials.
  id-token: write

jobs:
  remediate:
    uses: kernel/security-workflows/.github/workflows/vuln-remediation.yml@main
    with:
      go-version-file: 'server/go.mod'
      setup-python: true
    secrets: inherit
