name: Test for the server/ directory

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-headful:
    uses: ./.github/workflows/chromium-headful-image.yaml
    secrets: inherit

  build-headless:
    uses: ./.github/workflows/chromium-headless-image.yaml
    secrets: inherit

  test:
    runs-on: ubuntu-latest
    needs: [build-headful, build-headless]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "server/go.mod"
          cache: true

      - name: Compute short SHA for images
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run server Makefile tests
        run: make test
        working-directory: server
        env:
          E2E_CHROMIUM_HEADFUL_IMAGE: onkernel/chromium-headful:${{ steps.vars.outputs.short_sha }}
          E2E_CHROMIUM_HEADLESS_IMAGE: onkernel/chromium-headless:${{ steps.vars.outputs.short_sha }}

  # Runs the same e2e suite against the Hypeman backend instead of local Docker.
  # We do NOT build the images in Hypeman (its builder VM is RAM-disk-capped at
  # memory_mb=16384, which is too small for the chromium image build — see PR
  # description). Instead we reuse the public images that build-headful/
  # build-headless just pushed to Docker Hub: Hypeman pulls them itself on
  # instance create (any public/private registry works via the host's docker
  # creds), so the runner needs no docker login. KI_E2E_BACKEND=hypeman selects
  # the remote-VM backend; it reaches instances through the host's wildcard
  # ingress derived from HYPEMAN_BASE_URL.
  test-hypeman:
    runs-on: ubuntu-latest
    needs: [build-headful, build-headless]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "server/go.mod"
          cache: true

      - name: Compute short SHA for images
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Run server Makefile tests against Hypeman
        run: make test
        working-directory: server
        env:
          KI_E2E_BACKEND: hypeman
          HYPEMAN_BASE_URL: ${{ vars.HYPEMAN_API_URL }}
          HYPEMAN_API_KEY: ${{ secrets.HYPEMAN_API_KEY }}
          E2E_CHROMIUM_HEADFUL_IMAGE: onkernel/chromium-headful:${{ steps.vars.outputs.short_sha }}
          E2E_CHROMIUM_HEADLESS_IMAGE: onkernel/chromium-headless:${{ steps.vars.outputs.short_sha }}
