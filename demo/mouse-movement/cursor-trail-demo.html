<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse Movement Demo — Cursor Trail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: 'SF Mono', 'Fira Code', 'Monaco', monospace;
      background: #0d1117;
      color: #e6edf3;
      cursor: none;
    }
    #canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    #ui {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      padding: 12px 24px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid #30363d;
      border-radius: 12px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    #mode {
      font-weight: 600;
      color: #58a6ff;
    }
    #mode.instant { color: #f85149; }
    #mode.smooth { color: #3fb950; }
    #hint {
      color: #8b949e;
      font-size: 12px;
    }
    .cursor-dot {
      position: fixed;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      background: #58a6ff;
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      box-shadow: 0 0 12px rgba(88, 166, 255, 0.6);
      transition: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <span id="mode">Recording cursor trail…</span>
    <span id="hint">Move the mouse to see the path</span>
  </div>
  <div id="cursor-dot" class="cursor-dot"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cursorDot = document.getElementById('cursor-dot');
    const modeEl = document.getElementById('mode');

    let trail = [];
    const maxTrail = 2000;
    const trailColor = 'rgba(88, 166, 255, 0.85)';
    const trailWidth = 3;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      redraw();
    }

    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (trail.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(trail[0].x, trail[0].y);
      for (let i = 1; i < trail.length; i++) {
        ctx.lineTo(trail[i].x, trail[i].y);
      }
      ctx.strokeStyle = trailColor;
      ctx.lineWidth = trailWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    function addPoint(x, y) {
      trail.push({ x, y });
      if (trail.length > maxTrail) trail.shift();
      redraw();
    }

    function onMove(e) {
      addPoint(e.clientX, e.clientY);
      cursorDot.style.left = e.clientX + 'px';
      cursorDot.style.top = e.clientY + 'px';
    }

    window.addEventListener('resize', resize);
    document.addEventListener('mousemove', onMove);
    resize();

    window.demoApi = {
      setMode: (label, cls) => {
        modeEl.textContent = label;
        modeEl.className = cls || '';
      },
      clear: () => {
        trail = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    };
  </script>
</body>
</html>
