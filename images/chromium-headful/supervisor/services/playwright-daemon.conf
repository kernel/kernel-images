[program:playwright-daemon]
; Started by the wrapper once chromium is up, not lazily by the first
; /playwright/execute. The daemon binds its socket before it touches CDP and
; reconnects per request, so it tolerates chromium restarting underneath it.
command=/usr/local/bin/node /usr/local/lib/playwright-daemon.js
autostart=false
autorestart=true
startsecs=0
stopwaitsecs=5
stdout_logfile=/var/log/supervisord/playwright-daemon
redirect_stderr=true
