# For detailed configuration options, please refer to the Neko documentation:
# https://neko.m1k1o.net/docs/v3/configuration#file

capture:
  video:
    codec: "vp9"
    bitrate: 4000  # kbps — higher budget for motion-heavy frames (scrolling, video)
    params:
      vp9enc_deadline: 1            # realtime mode — required for interactive liveview
      vp9enc_cpu_used: 4            # 0-9; 4 balances quality vs CPU (vs 8 which sacrifices quality)
      vp9enc_end_usage: 1           # CBR — consistent quality during motion, avoids bitrate-cap degradation
      vp9enc_lag_in_frames: 0       # no lookahead — minimizes encoding latency for interactive use
      vp9enc_token_partitions: 2    # split frame into 4 partitions encoded in parallel

desktop:
  screen: "1920x1080@30"

member:
  provider: multiuser
  multiuser:
    admin_password: "admin"
    admin_profile:
      name: "" # if empty, the login username is used
      is_admin: true
      can_login: true
      can_connect: true
      can_watch: true
      can_host: true
      can_share_media: true
      can_access_clipboard: true
      sends_inactive_cursor: true
      can_see_inactive_cursors: true
    user_password: "neko"
    user_profile:
      name: "" # if empty, the login username is used
      is_admin: false
      can_login: true
      can_connect: true
      can_watch: true
      can_host: true
      can_share_media: true
      can_access_clipboard: true
      sends_inactive_cursor: true
      can_see_inactive_cursors: false

session:
  merciful_reconnect: true
  implicit_hosting: true
  cookie:
    # needed for legacy API
    enabled: false

plugins:
  enabled: false

chat:
  enabled: false

filetransfer:
  enabled: false

scaletozero:
  enabled: true
