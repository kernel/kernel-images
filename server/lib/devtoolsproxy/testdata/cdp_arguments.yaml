Input.dispatchDragEvent:
  "data.dragOperationsMask": retained
  "data.files": retained
  "data.items[].baseURL":
    redacted: the document the drag came from
  "data.items[].data":
    redacted: the drag payload itself
  "data.items[].mimeType": retained
  "data.items[].title":
    redacted: caller-supplied text describing the drag payload
  "modifiers": retained
  "type": retained
  "x": retained
  "y": retained

Input.dispatchKeyEvent:
  "autoRepeat": retained
  "code":
    redacted: names the character typed as surely as text does
  "commands": retained
  "isKeypad": retained
  "isSystemKey": retained
  "key": retained
  "keyIdentifier":
    redacted: names the character typed as surely as text does
  "location": retained
  "modifiers": retained
  "nativeVirtualKeyCode":
    redacted: names the character typed as surely as text does
  "text": retained
  "timestamp":
    redacted: a clock reading supplied by the client, not part of what the agent did
  "type": retained
  "unmodifiedText":
    redacted: the character typed, before modifiers applied
  "windowsVirtualKeyCode":
    redacted: names the character typed as surely as text does

