# Every argument of every browser-control command the proxy reports, with an
# explicit decision: retained in the cdp_command payload, or redacted and why.
#
# The argument list comes from testdata/cdp_protocol_pinned.json, generated from
# the pinned protocol by scripts/cdpmanifest. TestEveryCanonicalArgumentHasADecision
# fails when an argument here has no decision, when a retained argument is not
# actually decoded, or when the code decodes something this file does not declare.
# An argument added upstream therefore surfaces as a decision someone must make,
# rather than as a field that is quietly absent.
#
# retained means the argument reaches the payload, directly or as a derived value
# (a length, a count, a presence flag, an enum, a URL scheme). The schema names the
# field it becomes.
#
# Pinned protocol: https://github.com/ChromeDevTools/devtools-protocol/blob/2d019e73eb371d1d6985d26d395d78bd8f8a22ba/json/browser_protocol.json

Autofill.trigger:
  "address.fields[].name":
    redacted: caller-supplied field names with no protocol-defined set to allowlist against
  "address.fields[].value":
    redacted: the address the agent filled
  "card.cvc":
    redacted: the card security code
  "card.expiryMonth":
    redacted: part of the card the agent filled
  "card.expiryYear":
    redacted: part of the card the agent filled
  "card.name":
    redacted: the cardholder name
  "card.number":
    redacted: the card number
  "fieldId": retained
  "frameId": retained

Browser.cancelDownload:
  "browserContextId": retained
  "guid": retained

Browser.close:
  {}

Browser.setContentsSize:
