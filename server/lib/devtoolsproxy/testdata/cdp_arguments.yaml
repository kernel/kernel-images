  "touchPoints[].force": retained
  "touchPoints[].id":
    redacted: identifies one finger across frames, which only the full point list could use; the event reports the primary point
  "touchPoints[].radiusX": retained
  "touchPoints[].radiusY": retained
  "touchPoints[].rotationAngle": retained
  "touchPoints[].tangentialPressure": retained
  "touchPoints[].tiltX": retained
  "touchPoints[].tiltY": retained
